[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    handmade0octopus/ESP32-TWAI-CAN@1.0.1
    avinabmalla/ESP32_BleSerial@3.0.1

; Use USB-OTG + TinyUSB, not the fixed USB Serial/JTAG peripheral.
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DCAN_TX_PIN=5
    -DCAN_RX_PIN=4

monitor_speed = 115200

; Enter the ROM loader over native USB without needing BOOT/RESET buttons.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

; Host tests compile the same portable code, with fake USB and CAN drivers.
[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<esp32_io.cpp>
build_flags = -std=c++11 -Wall -Wextra -Werror -Itest/stubs
