name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Native tests
            environment: native
            command: pio test -e native
          - name: ESP32-S3 firmware
            environment: esp32-s3-devkitc-1
            command: pio run -e esp32-s3-devkitc-1

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Cache PlatformIO dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            .pio/libdeps
          key: ${{ runner.os }}-pio-6.2.0-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-6.2.0-${{ matrix.environment }}-

      - name: Run check
        run: ${{ matrix.command }}

      - uses: actions/setup-node@v6
        if: matrix.environment == 'native'
        with:
          node-version: '24'

      - name: Test web installer
        if: matrix.environment == 'native'
        run: node --test test/web_installer.test.mjs

      - name: Create factory flash image
        if: matrix.environment == 'esp32-s3-devkitc-1'
        run: |
          mkdir -p dist
          # Match the complete upload layout of the pinned ESP32-S3 board.
          python "$HOME/.platformio/packages/tool-esptoolpy/esptool.py" \
            --chip esp32s3 merge_bin \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            -o dist/gvret-s3-factory.bin \
            0x0000 .pio/build/esp32-s3-devkitc-1/bootloader.bin \
            0x8000 .pio/build/esp32-s3-devkitc-1/partitions.bin \
            0xe000 "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
            0x10000 .pio/build/esp32-s3-devkitc-1/firmware.bin

      - name: Upload factory firmware
        if: matrix.environment == 'esp32-s3-devkitc-1'
        uses: actions/upload-artifact@v7
        with:
          path: dist/gvret-s3-factory.bin
          archive: false
          if-no-files-found: error
          retention-days: 90

      - name: Prepare web installer
        if: >-
          matrix.environment == 'esp32-s3-devkitc-1' &&
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: python scripts/build_installer.py --firmware dist/gvret-s3-factory.bin --version "$GITHUB_SHA"

      - name: Upload Pages site
        if: >-
          matrix.environment == 'esp32-s3-devkitc-1' &&
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  pages:
    name: Publish web installer
    needs: check
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
