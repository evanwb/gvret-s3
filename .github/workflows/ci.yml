name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Native tests
            environment: native
            command: pio test -e native
          - name: ESP32-S3 firmware
            environment: esp32-s3-devkitc-1
            command: pio run -e esp32-s3-devkitc-1

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Cache PlatformIO dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            .pio/libdeps
          key: ${{ runner.os }}-pio-6.2.0-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-6.2.0-${{ matrix.environment }}-

      - name: Run check
        run: ${{ matrix.command }}
